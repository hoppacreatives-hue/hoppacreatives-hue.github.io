<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiddenZimbabwe | Curated Travel & MICE Experiences</title>
    <meta name="description" content="Discover Zimbabwe through curated travel experiences, hidden gems, heritage, nature, and city escapes. HiddenZimbabwe creates journeys with depth, belonging, and pulse.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --deep-green: #1a3c2a;
            --forest: #2d5a3f;
            --charcoal: #1c1c1c;
            --warm-gold: #c9a96e;
            --gold-light: #e8d5b5;
            --sand: #f5f0e8;
            --ivory: #faf8f5;
            --terracotta: #b8735a;
            --terracotta-muted: #c4957a;
            --text-dark: #2c2c2c;
            --text-medium: #5a5a5a;
            --text-light: #8a8a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 80px; }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background: var(--ivory);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; font-weight: 400; line-height: 1.2; }

        /* ===== NAVIGATION ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1.5rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
        }

        nav.scrolled {
            background: rgba(250, 248, 245, 0.97);
            backdrop-filter: blur(20px) saturate(1.2);
            padding: 1rem 4%;
            box-shadow: 0 2px 40px rgba(0,0,0,0.06);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 500;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.4s;
        }

        nav.scrolled .logo { color: var(--charcoal); }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
        }

        nav.scrolled .nav-links a { color: var(--text-dark); }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--warm-gold);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-links a:hover::after { width: 100%; }

        .nav-cta {
            padding: 0.6rem 1.5rem;
            background: var(--warm-gold);
            color: var(--charcoal) !important;
            border-radius: 2px;
            font-size: 0.75rem !important;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-cta:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
            z-index: 1001;
        }

        nav.scrolled .mobile-menu-btn { color: var(--charcoal); }

        /* ===== HERO ===== */
        .hero {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--charcoal);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a3c2a 0%, #2d5a3f 50%, #1c1c1c 100%);
            opacity: 0.95;
        }

        .hero-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect fill="%231a3c2a" width="1200" height="800"/><path fill="%232d5a3f" opacity="0.3" d="M0 400 Q300 200 600 400 T1200 400 L1200 800 L0 800 Z"/><path fill="%231c1c1c" opacity="0.2" d="M0 500 Q400 300 800 500 T1200 450 L1200 800 L0 800 Z"/></svg>');
            background-size: cover;
            background-position: center;
            opacity: 0.5;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            max-width: 900px;
            padding: 0 2rem;
        }

        .hero-tag {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: var(--gold-light);
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.3s forwards;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 300;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.5s forwards;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            opacity: 0.85;
            margin-bottom: 3rem;
            letter-spacing: 1px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.7s forwards;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.9s forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            padding: 1rem 2.5rem;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 2px;
        }

        .btn-primary {
            background: var(--warm-gold);
            color: var(--charcoal);
        }

        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(201, 169, 110, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(37, 211, 102, 0.25);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.2s forwards, bounce 2s infinite 2s;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        /* ===== SECTION UTILITIES ===== */
        section {
            padding: 7rem 4%;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-label {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--terracotta);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: var(--charcoal);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .section-subtitle {
            color: var(--text-medium);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
            font-weight: 300;
            line-height: 1.7;
        }

        /* ===== BRAND STATEMENT ===== */
        .brand-statement {
            background: var(--sand);
            padding: 8rem 4%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Organic topographic pattern for grey/sand sections */
        .brand-statement::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10,50 Q25,40 40,50 T70,50 T100,50' fill='none' stroke='%23c9a96e' stroke-width='0.3' opacity='0.15'/%3E%3Cpath d='M0,60 Q20,50 40,60 T80,60' fill='none' stroke='%23c9a96e' stroke-width='0.2' opacity='0.1'/%3E%3Cpath d='M15,70 Q35,60 55,70 T95,70' fill='none' stroke='%23b8735a' stroke-width='0.25' opacity='0.1'/%3E%3Cpath d='M5,30 Q30,20 55,30 T100,30' fill='none' stroke='%23c9a96e' stroke-width='0.2' opacity='0.08'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            pointer-events: none;
        }

        .brand-statement-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .brand-statement h2 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            margin-bottom: 2rem;
            color: var(--charcoal);
        }

        .brand-statement p {
            font-size: 1.2rem;
            color: var(--text-medium);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .brand-quote {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.5rem;
            color: var(--deep-green);
            margin-top: 2rem;
            opacity: 0.9;
        }

        .not-this {
            margin-top: 3rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .not-this-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .not-item {
            padding: 1.5rem;
            background: white;
            border-left: 3px solid var(--terracotta);
            text-align: left;
            transition: transform 0.3s ease;
        }

        .not-item:hover { transform: translateX(5px); }

        .not-item h4 {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--terracotta);
            margin-bottom: 0.5rem;
        }

        .not-item p {
            font-size: 0.9rem;
            color: var(--text-medium);
            margin: 0;
            line-height: 1.6;
        }

        /* ===== FEATURED EXPERIENCE ===== */
        .featured-experience {
            background: var(--charcoal);
            color: white;
            padding: 8rem 4%;
            position: relative;
            overflow: hidden;
        }

        .featured-experience::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201, 169, 110, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .featured-content {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .featured-text .section-label { color: var(--warm-gold); }

        .featured-text h2 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 1.5rem;
            color: white;
        }

        .featured-text p {
            font-size: 1.1rem;
            line-height: 1.9;
            opacity: 0.85;
            margin-bottom: 1.5rem;
        }

        .featured-highlights {
            list-style: none;
            margin: 2rem 0;
        }

        .featured-highlights li {
            padding: 0.8rem 0;
            padding-left: 2rem;
            position: relative;
            font-size: 1rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .featured-highlights li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--warm-gold);
        }

        .featured-visual {
            background: linear-gradient(135deg, var(--deep-green) 0%, var(--forest) 100%);
            height: 550px;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .featured-visual::after {
            content: 'Harare';
            font-family: 'Cormorant Garamond', serif;
            font-size: 9rem;
            color: rgba(255,255,255,0.04);
            position: absolute;
            bottom: -30px;
            right: -20px;
            font-weight: 600;
            letter-spacing: -2px;
        }

        .featured-visual-inner {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .featured-visual-inner .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
            display: block;
        }

        .featured-visual-inner p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-style: italic;
            opacity: 0.8;
            line-height: 1.6;
        }

        /* ===== BOOKING CALENDAR SECTION ===== */
        .booking-section {
            background: var(--ivory);
            padding: 7rem 4%;
            position: relative;
        }

        .booking-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10,50 Q25,40 40,50 T70,50 T100,50' fill='none' stroke='%23c9a96e' stroke-width='0.3' opacity='0.1'/%3E%3Cpath d='M0,60 Q20,50 40,60 T80,60' fill='none' stroke='%23c9a96e' stroke-width='0.2' opacity='0.08'/%3E%3C/svg%3E");
            background-size: 180px 180px;
            pointer-events: none;
        }

        .booking-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 4px;
            padding: 3.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .booking-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .booking-header h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            color: var(--charcoal);
            margin-bottom: 0.8rem;
        }

        .booking-header p {
            color: var(--text-medium);
            font-size: 1rem;
        }

        .booking-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-medium);
            margin-bottom: 0.6rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 1rem 1.2rem;
            border: 1px solid rgba(0,0,0,0.1);
            background: var(--ivory);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            border-radius: 2px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--warm-gold);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .date-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .booking-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .booking-note {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* ===== DESTINATIONS ===== */
        .destinations {
            background: var(--ivory);
            position: relative;
        }

        .destinations::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10,50 Q25,40 40,50 T70,50 T100,50' fill='none' stroke='%23c9a96e' stroke-width='0.3' opacity='0.08'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            pointer-events: none;
        }

        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            position: relative;
            z-index: 1;
        }

        .destination-card {
            position: relative;
            height: 450px;
            overflow: hidden;
            cursor: pointer;
            border-radius: 2px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .destination-card:hover {
            transform: translateY(-5px);
        }

        .destination-card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .destination-card:hover .destination-card-bg {
            transform: scale(1.08);
        }

        .destination-card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            color: white;
            transition: padding 0.4s ease;
        }

        .destination-card:hover .destination-card-content {
            padding-bottom: 3rem;
        }

        .destination-card h3 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .destination-card p {
            font-size: 1rem;
            opacity: 0.85;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
        }

        /* ===== WHY HIDDENZIMBABWE ===== */
        .why-section {
            background: var(--sand);
            position: relative;
            overflow: hidden;
        }

        .why-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10,50 Q25,40 40,50 T70,50 T100,50' fill='none' stroke='%23c9a96e' stroke-width='0.3' opacity='0.12'/%3E%3Cpath d='M0,60 Q20,50 40,60 T80,60' fill='none' stroke='%23b8735a' stroke-width='0.2' opacity='0.1'/%3E%3Cpath d='M15,70 Q35,60 55,70 T95,70' fill='none' stroke='%23c9a96e' stroke-width='0.25' opacity='0.08'/%3E%3C/svg%3E");
            background-size: 220px 220px;
            pointer-events: none;
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
            position: relative;
            z-index: 1;
        }

        .why-card {
            text-align: center;
            padding: 2.5rem 2rem;
            background: white;
            border-radius: 2px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .why-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
        }

        .why-icon {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            display: block;
            opacity: 0.7;
        }

        .why-card h3 {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--charcoal);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .why-card p {
            color: var(--text-medium);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* ===== BELONGING & HERITAGE ===== */
        .belonging {
            background: var(--deep-green);
            color: white;
            padding: 8rem 4%;
            position: relative;
            overflow: hidden;
        }

        /* Zimbabwe outline silhouette pattern for green sections */
        .belonging::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
